<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual-DTN Receiver</title>
  <!-- jsQR for real-time camera QR decoding -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; text-align: center; }
    video, canvas { width: 100%; max-width: 480px; border-radius: 12px; }
    #stats { margin: 16px auto; padding: 12px; background: #222; border-radius: 8px; max-width: 480px; text-align: left; font-size: 14px; }
    .success { color: #4ade80; font-weight: bold; }
    #output { word-break: break-all; max-height: 120px; overflow-y: auto; background: #000; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Visual-DTN Scanner</h2>
  <video id="video" playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <div id="stats">
    <div>Status: <span id="status">Point camera at QR</span></div>
    <div>Session ID: <span id="sess">-</span></div>
    <div>Blocks Needed (K): <span id="k_val">-</span></div>
    <div>Solved Blocks: <span id="solved_val">0</span></div>
    <div>Frames Ingested (M): <span id="frames_val">0</span></div>
    <div>Overhead (&epsilon;): <span id="overhead_val">-</span></div>
  </div>

  <h3>Decoded Output</h3>
  <div id="output">Waiting for complete transmission...</div>

  <script>
    const MAGIC_SYNC = 0xD751;
    let K = null, symbolSize = null, sessionId = null;
    let recoveredSymbols = new Map();
    let bufferedDroplets = [];
    let receivedCount = 0;
    let isComplete = false;

    // PRNG using SplitMix32 for deterministic random numbers
    function splitMix32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x9e3779b9 | 0;
        let t = seed ^ seed >>> 16; t = Math.imul(t, 0x21f0aaad);
        t = t ^ t >>> 15; t = Math.imul(t, 0x735a2d97);
        return ((t = t ^ t >>> 15) >>> 0) / 4294967296;
      }
    }

    // Robust Soliton distribution sampler
    function getSolitonSample(K, rng, c = 0.1, delta = 0.5) {
      let rho = new Float64Array(K + 1);
      rho[1] = 1.0 / K;
      for (let d = 2; d <= K; d++) rho[d] = 1.0 / (d * (d - 1));

      let tau = new Float64Array(K + 1);
      let R = c * Math.log(K / delta) * Math.sqrt(K);
      let pivot = R > 0 ? Math.floor(K / R) : K;

      for (let d = 1; d <= K; d++) {
        if (d < pivot) tau[d] = R / (d * K);
        else if (d === pivot) tau[d] = (R * Math.log(R / delta)) / K;
      }

      let beta = 0;
      let mu = new Float64Array(K + 1);
      for (let d = 1; d <= K; d++) {
        mu[d] = rho[d] + tau[d];
        beta += mu[d];
      }

      let rand = rng();
      let cumulative = 0;
      for (let d = 1; d <= K; d++) {
        cumulative += mu[d] / beta;
        if (rand <= cumulative) return d;
      }
      return K;
    }

    function xorBuffers(b1, b2) {
      let res = new Uint8Array(b1.length);
      for (let i = 0; i < b1.length; i++) res[i] = b1[i] ^ b2[i];
      return res;
    }

    function ingestDroplet(bytes) {
      if (bytes.length < 20 || isComplete) return;
      let view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

      let magic = view.getUint16(0);
      let ver = view.getUint8(2);
      if (magic !== MAGIC_SYNC || ver !== 0x01) return;

      let sess = view.getUint32(4);
      let seed = view.getUint32(8);
      let totalK = view.getUint16(12);
      let symSize = view.getUint16(14);
      let data = bytes.slice(20);

      if (data.length !== symSize) return;

      if (K === null) {
        K = totalK;
        symbolSize = symSize;
        sessionId = sess;
        document.getElementById('sess').textContent = sess;
        document.getElementById('k_val').textContent = K;
      } else if (sessionId !== sess) {
        return;
      }

      receivedCount++;
      document.getElementById('frames_val').textContent = receivedCount;

      let rng = splitMix32(seed);
      let degree = getSolitonSample(K, rng);

      // Sample without replacement
      let pool = Array.from({length: K}, (_, i) => i);
      let indices = new Set();
      for (let i = 0; i < degree; i++) {
        let picked = Math.floor(rng() * pool.length);
        indices.add(pool[picked]);
        pool.splice(picked, 1);
      }

      // Peel known symbols
      for (let idx of Array.from(indices)) {
        if (recoveredSymbols.has(idx)) {
          data = xorBuffers(data, recoveredSymbols.get(idx));
          indices.delete(idx);
        }
      }

      if (indices.size > 0) {
        bufferedDroplets.push({ indices, data });
        peel();
      }

      document.getElementById('solved_val').textContent = recoveredSymbols.size;

      if (recoveredSymbols.size === K && !isComplete) {
        isComplete = true;
        let eps = ((receivedCount - K) / K).toFixed(3);
        document.getElementById('overhead_val').textContent = eps;
        document.getElementById('status').innerHTML = '<span class="success">DECODE COMPLETE!</span>';

        let fullLength = K * symbolSize;
        let assembled = new Uint8Array(fullLength);
        for (let i = 0; i < K; i++) {
          assembled.set(recoveredSymbols.get(i), i * symbolSize);
        }
        let text = new TextDecoder().decode(assembled);
        document.getElementById('output').textContent = text;
      }
    }

    function peel() {
      let progress = true;
      while (progress) {
        progress = false;
        let singletonIndex = bufferedDroplets.findIndex(d => d.indices.size === 1);
        if (singletonIndex !== -1) {
          progress = true;
          let item = bufferedDroplets.splice(singletonIndex, 1)[0];
          let idx = item.indices.values().next().value;
          recoveredSymbols.set(idx, item.data);

          for (let d of bufferedDroplets) {
            if (d.indices.has(idx)) {
              d.data = xorBuffers(d.data, item.data);
              d.indices.delete(idx);
            }
          }
        }
      }
    }

    // Camera initialization
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      requestAnimationFrame(tick);
    }).catch(err => {
      document.getElementById('status').textContent = "Camera error: " + err.message;
    });

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && !isComplete) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        let code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.binaryData) {
          ingestDroplet(new Uint8Array(code.binaryData));
        }
      }
      requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
